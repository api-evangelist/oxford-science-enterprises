name: Oxford Science Enterprises
description: 'Oxford Science Enterprises (OSE) is an independent investment company and venture builder
  that transforms cutting-edge research from the University of Oxford into commercial companies tackling
  global challenges across deep tech, life sciences, and health tech. Operating on a "find, fund, build"
  model, OSE provides patient capital and hands-on company-building to Oxford science founders, backing
  50+ flagship companies with a net asset value of around £1.3bn alongside 300+ co-investors. Notable
  outcomes include Oxford Ionics (acquired by IonQ) and Dark Blue Therapeutics. This is a company profile
  in the API Evangelist network; OSE is an investor and venture builder and does not publish a public API
  or developer program.'
